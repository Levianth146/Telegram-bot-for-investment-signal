[pytest]
# Packages live at repo root (bot/, fundamental_filter/, …). Without pythonpath,
# nested tests under package dirs fail collection with ModuleNotFoundError.
pythonpath = .
addopts = --import-mode=importlib
testpaths =
    tests
    fundamental_filter/tests
    fundamental_filter/layer1_engine
    quant_engine/tests
    data/tests
    pipeline/tests
    backtest/tests
    bot/tests
# layer1_engine keeps unittest modules named test_*.py beside production code
python_files = test_*.py
