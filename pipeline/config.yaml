# Cấu hình bật/tắt từng tầng — xem mục 11.1 (P0/P1/P2) trong tài liệu framework.
# Tắt một tầng P1/P2 ở đây KHÔNG được làm crash pipeline; mỗi module phải tự
# xử lý trường hợp enabled=false bằng giá trị fallback (xem docs/ARCHITECTURE.md).

universe:
  name: "vn100"
  size: 100
  # Tier1 Fundamental (quarterly) + OUT_OF_SCOPE cho bot — CSV VN100
  fundamental_file: "data/universe/vn100.csv"
  # Alias mặc định (độc giả cũ đọc universe.file); trùng fundamental_file
  file: "data/universe/vn100.csv"
  # Smoke / ablation / fallback nhanh — không xóa CSV này
  smoke_file: "data/universe/hose_liquid_35.csv"
  # Tầng 2 Quant (daily): chỉ watchlist PASS/WATCH (+ benchmark VNINDEX)
  quant_from_watchlist: true
  # V1: chỉ HOSE + HNX — không phân tích UPCOM (và sàn ngoài list)
  allowed_exchanges: [HOSE, HNX]

# Nguồn dữ liệu & thứ tự fallback — xem đánh giá đầy đủ trong docs/DATA_AUDIT.md.
# QUAN TRỌNG: data/providers/ implement 1 interface chung theo từng loại dữ liệu bên
# dưới (vd PriceProvider, FinancialStatementProvider); pipeline/ CHỈ gọi qua interface
# đó, không hardcode tên nguồn cụ thể ở bất kỳ file nào khác ngoài config này. Muốn đổi
# thứ tự ưu tiên hay thêm/bớt nguồn thì sửa ở đây, không sửa code.
data_sources:
  price:
    # Giá/khớp lệnh cho Tầng 2 (Regime/Kalman/OU/GARCH), gọi lại mỗi phiên.
    # Thử lần lượt theo thứ tự, nguồn lỗi/timeout thì log lại rồi thử nguồn kế tiếp.
    chain: [dnse, vnstock, cafef]
    request_delay_ms: 250   # throttle giữa các mã OHLCV (0 = tắt; tests dùng 0)
    cache_ohlcv: true       # CSV dưới cache_dir; hit theo ticker+start+end
    cache_dir: "data/cache"
    notes: >
      dnse = DNSE Market Data API (cần API key, hạ tầng CTCK thật -> ưu tiên nhất).
      vnstock = tự có multi-source nội bộ (VCI/TCBS/MSN) -> coi như 1 lớp fallback sẵn.
      cafef = scrape HTML, giòn, chỉ chạm tới khi cả 2 nguồn trên đều lỗi.

  financial_statements_live:
    # BCTC quý mới nhất cho Tầng 1, chạy khi có công bố mới (event-driven, tần suất thấp).
    chain: [vnstock, cafef, vietstock]
    fiin_datafeed:
      enabled: false
      note: >
        API trả phí cấp tổ chức (datafeed.fiingroup.vn) — chỉ bật nếu nhóm xin được
        academic access; đừng đặt tiến độ phụ thuộc vào nguồn này.

  financial_statements_backtest:
    # BCTC lịch sử để chạy walk-forward backtest — KHÔNG dùng cho pipeline sống, vì dữ
    # liệu là snapshot tĩnh, không đảm bảo có quý mới nhất.
    primary: vnfinancialdata
    # Assumed lag (không phải filed_at vendor): period-end năm + N ngày.
    # Xem docs/DATA_AUDIT.md §4b và docs/DECISIONS.md.
    point_in_time_verified: true
    assumed_publication_lag_days: 90

  reference_only:
    # KHÔNG gọi tự động trong pipeline (không đủ tài liệu API để tin cậy) — chỉ dùng
    # thủ công để đối chiếu chéo khi nghi ngờ số liệu từ nguồn khác.
    sources: [quantvn]

fundamental_filter:
  growth: { enabled: true, tier: P0 }
  quality: { enabled: true, tier: P0 }
  safety_accounting: { enabled: true, tier: P0 }
  safety_merton_dd: { enabled: false, tier: P2 }   # bật sau khi qua data audit
  valuation: { enabled: true, tier: P0 }
  valuation_dcf: { enabled: false, tier: P2 }       # cần nhiều dữ liệu giả định
  # Phạm vi V1: loại mã tài chính trước khi chấm điểm (framework phần đầu tài liệu)
  exclude_financials: true
  min_industry_peers: 3   # dưới ngưỡng → fallback universe cross-section

quant_engine:
  regime_markov: { enabled: true, tier: P0 }
  alpha_kalman_trend: { enabled: true, tier: P0 }
  alpha_ou_meanreversion: { enabled: true, tier: P0 }
  risk_garch:
    enabled: true
    tier: P0
    # P2-1 stub: null = refit mỗi phiên (V1). Đặt N (vd. 5/21) chỉ sau khi nhóm
    # chốt + ghi DECISIONS — hiện hook chỉ log, chưa đổi semantics.
    refit_every_n: null
  portfolio_black_litterman:
    enabled: false
    tier: P1
    tau: 0.05
    delta: 2.5   # risk aversion for equilibrium π = δ Σ w_mkt
    # fallback: equal-weight when disabled or singular cov
  probabilistic_monte_carlo:
    enabled: false
    tier: P1
    n_paths: 2000
    horizon_days: 10
    tp_pct: 0.08   # mục tiêu +8% trong ví dụ framework
  probabilistic_hawkes: { enabled: false, tier: P2 }       # cần data audit
  # Benchmark cho Regime (filtered P(bull)); nếu thiếu trong price pull → ticker đầu watchlist
  benchmark: VNINDEX
  sigma_target: 0.02   # vol mục tiêu ngày (decimal) cho position_size
  w_max: 0.10          # trần % NAV / mã
  stop_k: 2.0          # stop = entry * (1 - k * sigma_hat)
  bull_threshold: 0.55
  bear_threshold: 0.35
  min_slope_tstat: 1.0

backtest:
  start_date: "2019-01-01"
  cost:
    tax_sell_pct: 0.001
    fee_roundtrip_pct: 0.003
  walk_forward:
    train_years: 3
    test_months: 6
  metrics:
    # CORE (luôn tính, đã ghi vào backtest_results ngay từ đầu): cagr, sharpe,
    # max_drawdown, win_rate, n_trades — không cần cờ bật/tắt vì bắt buộc.
    turnover: { enabled: true, tier: P0 }
    sortino: { enabled: true, tier: P0 }
    calmar: { enabled: true, tier: P0 }
    profit_factor: { enabled: true, tier: P0 }
    max_drawdown_days: { enabled: true, tier: P0 }
    cvar95_calibration: { enabled: false, tier: P1 }   # so dự báo CVaR95 (bảng signals) với thực tế
    regime_conditional_sharpe: { enabled: false, tier: P1 }  # sharpe_bull_regime/sharpe_bear_regime
    margin_bps: { enabled: true, tier: P0 }            # lấy cảm hứng từ WQ Brain: return / turnover
    yearly_breakdown: { enabled: true, tier: P0 }      # bảng theo năm, ghi vào backtest_yearly_breakdown

  # Ngưỡng đăng ký TRƯỚC khi chạy ablation lần đầu (đồng bộ với docs/DECISIONS.md —
  # sửa ở đây thì PHẢI sửa cả bên đó, không được đổi ngưỡng sau khi đã thấy kết quả).
  # backtest/ablation.py đối chiếu các ngưỡng này và ghi PASS/FAIL vào backtest_checks.
  checks:
    min_sharpe_improvement_oos: 0.10   # Sharpe framework - Sharpe B0 phải >= mức này (OOS)
    min_trades_for_significance: 30    # dưới ngưỡng này thì mọi Sharpe/Calmar chỉ mang tính minh hoạ
    max_turnover_pct: 200              # % NAV/năm — turnover vượt mức này thì chi phí giao dịch có thể ăn hết alpha
    max_position_weight_pct: 0.10      # CONCENTRATED_WEIGHT — khớp quant_engine.w_max; vượt = FAIL

sector_classification:
  # Hạ tầng cho scoring z-score "theo ngành" ở mục 10 — xem store/schema.sql:sector_mapping.
  enabled: true
  tier: P0
  source: vnstock   # field phân ngành ICB có sẵn, không cần tự xây taxonomy
  refresh_cadence: "monthly"   # phân ngành hiếm khi đổi, không cần cập nhật theo phiên
  sector_overview_command: { enabled: true, tier: P1 }  # /sector — tổng quan top-down

scoring:
  method: "percentile_zscore"   # xem mục 10 tài liệu framework
  pass_percentile: 0.60
  fail_percentile: 0.30
